{% extends "base.html" %}
{% block title %}Register patient{% endblock %}
{% block heading %}Register patient{% endblock %}
{% block subheading %}Add a new patient record{% endblock %}

{% block content %}
<div class="row">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-body">
        <form method="post" novalidate>
          {% csrf_token %}
          {% include "includes/form_fields.html" %}
          <div class="d-flex gap-2 pt-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-lg me-1"></i>Save patient
            </button>
            <a href="{% url 'patient_list' %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
